<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الطلبات | هايبر المطرية</title>
<style>
:root{font-family:system-ui,'Cairo',Tahoma,sans-serif;color:#202923;background:#f7f8f6}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:3px solid #187a45;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0;color:#b32228}main{max-width:1100px;margin:24px auto;padding:0 14px}.panel,.order{background:white;border:1px solid #e1e6e1;border-radius:13px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #00000008}.panel{max-width:520px;margin:30px auto}label{display:block;margin:12px 0 5px;font-weight:650}input,select,button{font:inherit;border-radius:8px;padding:11px;width:100%;border:1px solid #ccd5ce}button{background:#187a45;color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#a7242c}.muted{color:#68736b;font-size:14px}.error{color:#a7242c}.success{color:#187a45}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{width:auto}.orders{display:grid;gap:14px}.order h2{font-size:17px;margin:0}.order p{margin:8px 0;overflow-wrap:anywhere}.order ul{padding-right:22px}.order li{margin:5px 0}.order select{max-width:240px}.status{font-weight:700;color:#187a45}.hidden{display:none!important}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.filters select{max-width:230px}small{font-size:12px}a{color:#187a45}@media(min-width:850px){.orders{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>هايبر المطرية | إدارة الطلبات</h1><button id="logout" class="secondary hidden" style="width:auto">تسجيل الخروج</button></header>
<main>
<section id="loginPanel" class="panel"><h2>دخول المسؤول</h2><p class="muted">الصفحة مخصصة لحسابات إدارة المتجر المعتمدة فقط.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit" style="margin-top:16px">تسجيل الدخول</button></form><p id="loginMessage" role="alert"></p></section>
<section id="dashboard" class="hidden"><div class="top"><h2>طلبات العملاء</h2><div class="actions"><button id="reload">تحديث الطلبات</button></div></div><p class="muted">طلبات واتساب المسجلة لا تُعد مبيعات مؤكدة إلا بعد تغيير حالتها. تُعرض أحدث 100 طلب.</p><div class="filters"><label for="filter">الحالة:</label><select id="filter"><option value="all">كل الطلبات</option><option value="pending_whatsapp">جديد / انتظار واتساب</option><option value="confirmed">مؤكد</option><option value="delivered">تم التوصيل</option><option value="cancelled">ملغي</option></select></div><p id="dashboardMessage" role="status"></p><div id="orders" class="orders"></div></section>
</main>
<script>
'use strict';
const SUPABASE_URL='https://mysycmmwpzgvyevclwvn.supabase.co';
const SUPABASE_KEY='sb_publishable_3Mv4NoJU8kb4ffL2b6rYvA_DSAtOrp3';
const $=id=>document.getElementById(id);
const statusNames={pending_whatsapp:'جديد / انتظار واتساب',confirmed:'مؤكد',delivered:'تم التوصيل',cancelled:'ملغي'};
let session=null,orders=[];
function message(id,text,error=false){$(id).textContent=text;$(id).className=error?'error':'muted';}
function headers(token){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};}
async function request(path,options={}){const res=await fetch(SUPABASE_URL+path,options);let data=null;try{data=await res.json();}catch{}if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||data?.error||'تعذر الاتصال بالخادم');return data;}
function saveSession(s){session=s;try{sessionStorage.setItem('hyper_admin_session',JSON.stringify(s));}catch{}}
function clearSession(){session=null;try{sessionStorage.removeItem('hyper_admin_session');}catch{}}
async function accessToken(){if(!session)throw new Error('يرجى تسجيل الدخول');if(Date.now()/1000<(session.expires_at||0)-90)return session.access_token;if(!session.refresh_token)throw new Error('انتهت الجلسة، سجّل الدخول مرة أخرى');const s=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});saveSession({...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in});return session.access_token;}
async function verifyAdmin(){const token=await accessToken();const data=await request('/rest/v1/store_admins?select=user_id&limit=1',{headers:headers(token)});if(!Array.isArray(data)||data.length!==1)throw new Error('هذا الحساب ليس لديه صلاحية إدارة المتجر');}
function showDashboard(){ $('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');}
function showLogin(){ $('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('password').value='';}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node;}
function field(parent,label,value){const p=el('p');const strong=el('strong',label+' ');p.append(strong,document.createTextNode(String(value??'—')));parent.append(p);}
function render(){const list=$('orders');list.replaceChildren();const filtered=orders.filter(o=>$('filter').value==='all'||o.status===$('filter').value);if(!filtered.length){list.append(el('p','لا توجد طلبات في هذه الحالة.','muted'));return;}for(const o of filtered){const card=el('article',undefined,'order');const top=el('div',undefined,'top');top.append(el('h2','طلب '+String(o.request_id||'').slice(0,8)),el('span',statusNames[o.status]||o.status,'status'));card.append(top);field(card,'التاريخ:',o.created_at?new Date(o.created_at).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'—');field(card,'العميل:',o.customer_name);field(card,'الهاتف:',o.customer_phone);field(card,'المنطقة:',o.customer_area);field(card,'العنوان:',o.customer_address);if(o.customer_notes)field(card,'ملاحظات:',o.customer_notes);field(card,'المنتجات:',Number(o.subtotal||0).toLocaleString('ar-EG')+' جنيه');field(card,'التوصيل:',Number(o.delivery_fee||0).toLocaleString('ar-EG')+' جنيه');field(card,'الإجمالي:',Number(o.total||0).toLocaleString('ar-EG')+' جنيه');const items=el('ul');for(const item of Array.isArray(o.items)?o.items:[]){const name=item.name??item.product_name??item.title??'منتج';const qty=item.quantity??item.qty??1;items.append(el('li',name+' × '+qty));}card.append(items);const label=el('label','تغيير الحالة:');const sel=el('select');for(const [value,title] of Object.entries(statusNames)){const opt=el('option',title);opt.value=value;sel.append(opt);}sel.value=o.status;sel.setAttribute('aria-label','حالة طلب '+String(o.request_id||'').slice(0,8));sel.addEventListener('change',async()=>{const next=sel.value;sel.disabled=true;try{const token=await accessToken();const updated=await request('/rest/v1/store_order_requests?request_id=eq.'+encodeURIComponent(o.request_id)+'&select=request_id,status',{method:'PATCH',headers:{...headers(token),'Prefer':'return=representation'},body:JSON.stringify({status:next})});if(!Array.isArray(updated)||updated.length!==1)throw new Error('لم يتم تحديث الطلب');o.status=next;message('dashboardMessage','تم تحديث حالة الطلب '+String(o.request_id).slice(0,8));render();}catch(err){sel.value=o.status;message('dashboardMessage','فشل التحديث: '+err.message,true);}finally{sel.disabled=false;}});label.append(sel);card.append(label);list.append(card);}}
async function loadOrders(){message('dashboardMessage','جارٍ تحميل الطلبات...');try{const token=await accessToken();const data=await request('/rest/v1/store_order_requests?select=*&order=created_at.desc&limit=100',{headers:headers(token)});if(!Array.isArray(data))throw new Error('استجابة غير متوقعة');orders=data;message('dashboardMessage','عدد الطلبات المعروضة: '+orders.length);render();}catch(err){message('dashboardMessage','تعذر تحميل الطلبات: '+err.message,true);}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;message('loginMessage','جارٍ تسجيل الدخول...');try{const data=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});saveSession({...data,expires_at:Math.floor(Date.now()/1000)+data.expires_in});await verifyAdmin();$('password').value='';showDashboard();await loadOrders();}catch(err){clearSession();message('loginMessage',err.message,true);}finally{$('loginButton').disabled=false;}});
$('logout').addEventListener('click',async()=>{const old=session;clearSession();showLogin();message('loginMessage','تم تسجيل الخروج');if(old?.access_token){try{await request('/auth/v1/logout',{method:'POST',headers:headers(old.access_token)});}catch{}}});
$('reload').addEventListener('click',loadOrders);$('filter').addEventListener('change',render);
(async()=>{try{const stored=sessionStorage.getItem('hyper_admin_session');if(!stored)return;session=JSON.parse(stored);await verifyAdmin();showDashboard();await loadOrders();}catch{clearSession();showLogin();}})();
</script>
</body>
</html>
