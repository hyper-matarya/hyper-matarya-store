<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هايبر المطرية | المتجر الإلكتروني</title><style>body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f8f6;color:#222}header{background:white;padding:20px;border-bottom:4px solid #187a40;text-align:center}h1{color:#b9232e;margin:0}small{color:#666}.wrap{max-width:960px;margin:auto;padding:16px}.hero{background:#e9f4ed;padding:22px;border-radius:15px;margin:15px 0}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}.item{background:white;border:1px solid #eee;border-radius:12px;padding:17px}.item h3{margin:0 0 12px}.price{color:#187a40;font-weight:bold}button,.action{background:#187a40;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}.item button{margin-top:10px}.cart{background:white;border-radius:12px;padding:20px;margin:20px 0;border:1px solid #ddd}.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.cart-row button{background:#b9232e;padding:7px 10px}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{text-align:center;padding:24px;color:#666}</style></head><body><header><h1>هايبر المطرية</h1><small>متجرك قريب منك على مدار 24 ساعة</small></header><main class="wrap"><section class="hero"><h2>كل احتياجات بيتك في مكان واحد</h2><p>توصيل مجاني وفق مناطق وشروط الخدمة المعتمدة.</p><input id="search" placeholder="ابحث عن منتج..." oninput="render()"></section><h2>منتجات تجريبية</h2><p>الأسعار والمنتجات التالية للعرض التجريبي فقط، ويجب مراجعتها قبل النشر.</p><div id="products" class="grid"></div><section class="cart"><h2>سلة المشتريات</h2><div id="cart"></div><h3 id="total"></h3><div class="actions"><button onclick="sendOrder()">إرسال الطلب عبر واتساب</button><button onclick="clearCart()" style="background:#777">تفريغ السلة</button></div></section></main><footer>هايبر المطرية — خدمة العملاء: 01222203202</footer><script>const products=[{name:'بن هايبر المطرية 50 جم',price:30},{name:'بن هايبر المطرية 100 جم',price:55},{name:'بن هايبر المطرية 250 جم',price:135},{name:'دبس رمان يمامة 330 مل',price:100}];let cart=[];function render(){const q=document.getElementById('search').value.trim();document.getElementById('products').innerHTML=products.map((p,i)=>({...p,i})).filter(p=>p.name.includes(q)).map(p=>`<article class="item"><h3>${p.name}</h3><div class="price">${p.price} جنيه</div><button onclick="add(${p.i})">أضف للسلة</button></article>`).join('')||'<p>لا توجد نتائج</p>';renderCart()}function add(i){const c=cart.find(x=>x.i===i);if(c)c.qty++;else cart.push({i,qty:1});renderCart()}function removeItem(i){cart=cart.filter(x=>x.i!==i);renderCart()}function clearCart(){cart=[];renderCart()}function renderCart(){document.getElementById('cart').innerHTML=cart.map(c=>`<div class="cart-row"><span>${products[c.i].name} × ${c.qty}</span><span>${products[c.i].price*c.qty} جنيه <button onclick="removeItem(${c.i})">حذف</button></span></div>`).join('')||'<p>السلة فارغة</p>';document.getElementById('total').textContent='الإجمالي: '+cart.reduce((s,c)=>s+products[c.i].price*c.qty,0)+' جنيه'}function sendOrder(){if(!cart.length){alert('أضف منتجات للسلة أولًا');return}const msg='طلب تجريبي من متجر هايبر المطرية\n'+cart.map(c=>`${products[c.i].name} × ${c.qty} = ${products[c.i].price*c.qty} جنيه`).join('\n')+'\nالإجمالي: '+cart.reduce((s,c)=>s+products[c.i].price*c.qty,0)+' جنيه\nيرجى تأكيد الأسعار والتوافر والتوصيل.';window.open('https://wa.me/20122203202?text='+encodeURIComponent(msg),'_blank')}render();</script></body></html>
